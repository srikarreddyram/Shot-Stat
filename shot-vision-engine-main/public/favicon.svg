<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SHOT VISION">
  <!-- Simplified for 16–32px: thicker strokes, no highlight or bezel,
       so the ball-and-eye still reads in a browser tab. -->
  <rect width="64" height="64" rx="14" fill="#0b0b10"/>
  <circle cx="32" cy="32" r="22" fill="#3a220e"/>
  <clipPath id="b"><circle cx="32" cy="32" r="22"/></clipPath>
  <g clip-path="url(#b)" fill="none" stroke="#D9B85C" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="8" x2="32" y2="56" stroke-width="3"/>
    <path d="M 9 32 Q 32 13 55 32"/>
    <path d="M 9 32 Q 32 51 55 32"/>
  </g>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#D9B85C" stroke-width="4.5"/>
  <circle cx="32" cy="32" r="8" fill="#D9B85C"/>
  <circle cx="32" cy="32" r="3.4" fill="#0b0b10"/>
</svg>
